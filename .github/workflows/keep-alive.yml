# Goi web dinh ky de Render free khong cho app ngu (ngu sau 15 phut khong co truy cap)
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site
        run: curl -fsS -o /dev/null -w "%{http_code} %{time_total}s\n" --retry 3 --retry-delay 20 --max-time 120 https://vlxd-anhvu.onrender.com/
