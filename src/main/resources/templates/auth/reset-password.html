<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - VLXD Anh Vũ</title>
    <link rel="icon" type="image/svg+xml" href="/images/anh-vu-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=27)}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <a class="auth-logo" href="/"><img src="/images/anh-vu-logo.svg" alt="Anh Vu logo"></a>
        <span>Bảo mật tài khoản</span>
        <h1>Đặt lại mật khẩu</h1>
        <div class="form-error auth-alert" th:if="${error}" th:text="${error}">Lỗi</div>
        <div class="form-error auth-alert" th:if="${!validToken}">Phiên đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</div>
        <form class="auth-form" th:if="${validToken}" th:action="@{/dat-lai-mat-khau}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <label>Mật khẩu mới<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
            <label>Nhập lại mật khẩu<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required></label>
            <button type="submit">Cập nhật mật khẩu</button>
        </form>
        <div class="auth-links">
            <a href="/quen-mat-khau">Gửi mã mới</a>
            <a href="/dang-nhap">Đăng nhập</a>
        </div>
    </section>
</main>
</body>
</html>
