<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - VLXD Anh Vũ</title>
    <link rel="icon" type="image/svg+xml" href="/images/anh-vu-logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=27)}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <a class="auth-logo" href="/"><img src="/images/anh-vu-logo.svg" alt="Anh Vu logo"></a>
        <span>Bảo mật tài khoản</span>
        <h1>Lấy lại mật khẩu</h1>
        <div class="form-success" th:if="${message}" th:text="${message}">Thông báo</div>
        <div class="form-error auth-alert" th:if="${error}" th:text="${error}">Lỗi</div>
        <form class="auth-form" th:action="@{/quen-mat-khau}" method="post">
            <label>Email tài khoản<input type="email" name="email" autocomplete="email" required></label>
            <button type="submit">Gửi mã xác nhận</button>
        </form>
        <div class="auth-links">
            <a href="/dang-nhap">Quay lại đăng nhập</a>
            <a href="/">Về trang chủ</a>
        </div>
    </section>
</main>
</body>
</html>
